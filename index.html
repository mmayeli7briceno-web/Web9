<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"

      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
</head>

<body>
<nav class="navbar md:navbar-expand bg-1 fg-2">
  <div class="container-fluid">
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarProductos" aria-controls="navbarProductos" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarProductos" aria-labelledby="navbarProductosLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarProductosLabel">Sistema de Almacén</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body">
        <a class="navbar-brand" href="#">Sistema de Almacén</a>
        <ul class="navbar-nav me-auto mb-2 md:mb-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Categorías</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Proveedores</a></li>
        </ul>
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Buscar producto..." aria-label="Search"/>
          <button class="btn-outline theme-success" type="submit">Buscar</button>
        </form>
      </div>
    </dialog>
  </div>
</nav>

<div class="row">
  <div class="table-responsive">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
        </tr>
      </thead>
      <tbody>
      <!-- {} contenido -->
      <!-- * repeticiones -->
       <!-- $ incremental -->
        <!-- (tr>(td{$}+td{Nombre de Software}+td{100 Mb}+td{Microsoft}+td{2.0}))*10 -->
        <tr>
          <td>1</td>
              <td>Laptop Lenovo IdeaPad 3</td>
              <td>Computadoras</td>
              <td>S/ 2,450.00</td>
              <td>15</td>
        </tr>
        <tr>
          <td>2</td>
              <td>Mouse Inalámbrico Logitech M185</td>
              <td>Accesorios</td>
              <td>S/ 55.00</td>
              <td>40</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
</div>

    <script
      type="module"
